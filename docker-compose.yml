services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DEMO_MODE: ${DEMO_MODE:-false}
      APP_SECRET: ${APP_SECRET}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      DRAW_OPENS_AT: ${DRAW_OPENS_AT:-2026-10-28T15:00:00+08:00}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LEADERBOARD_LIMIT: ${LEADERBOARD_LIMIT:-100}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
    depends_on:
      database: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${HTTP_BIND:-127.0.0.1}:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
